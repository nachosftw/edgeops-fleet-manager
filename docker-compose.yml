services:
  backend:
    build: ./backend
    container_name: fleetops-backend
    ports:
      - "5000:5000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////data/fleetops.db
      - SEED_DEMO_DATA=true
    volumes:
      - fleet-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: fleetops-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fleet-data:
