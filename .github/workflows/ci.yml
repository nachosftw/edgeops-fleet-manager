name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "claude/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Unit tests
        run: pytest -m unit
      - name: Integration tests
        run: pytest -m integration
      - name: Regression tests
        run: pytest -m regression
      - name: Coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  frontend:
    name: Frontend build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r backend/requirements.txt
      - run: npm install && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend

  docker:
    name: Docker images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d && sleep 10 && curl -fsS http://localhost:3000/api/v1/health
      - run: docker compose down
